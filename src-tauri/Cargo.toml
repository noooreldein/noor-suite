[package]
name = "noor-suite"
version = "3.2.0"
description = "Noor Suite — نظام إدارة أعمال متكامل"
authors = ["noooreldein"]
edition = "2021"

[lib]
name = "noor_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
